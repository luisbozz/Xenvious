name: Wiki

# The documentation lives in docs/wiki/ so it is reviewed together with the code.
# This copies it into the GitHub wiki (a separate repository) on every change, so
# the Wiki tab shows the same pages. Edit the files in docs/wiki/, not the wiki:
# the next run overwrites changes made there.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          path: code
          persist-credentials: false

      # The wiki repository exists once its first page was created in the web UI.
      - name: Check out the wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Copy the pages
        run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          cp code/docs/wiki/*.md wiki/
          # Wiki pages link without the .md extension.
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' wiki/*.md
          printf 'Generated from [`docs/wiki/`](%s/tree/main/docs/wiki) — edit the pages there, changes made here are overwritten.\n' \
            "${{ github.server_url }}/${{ github.repository }}" > wiki/_Footer.md

      - name: Publish
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
          else
            git commit -m "Sync from ${GITHUB_SHA::7}"
            git push
          fi
